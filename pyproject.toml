[project]
name = "everything-mcp"
version = "0.1.0"
description = "MCP server for the local voidtools Everything HTTP search API"
requires-python = ">=3.11"
dependencies = ["mcp>=1.9"]

[project.scripts]
everything-mcp = "everything_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
